<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Swarm | Your AI Desktop</title>
    <meta name="description" content="Everyone gets a Jarvis now. Open Swarm is your 100% free AI desktop for Mac. Join the free waitlist for early access." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="preload" as="image" href="./media/hero-sky.webp" fetchpriority="high" />

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Manrope:wght@800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Manrope:wght@800&display=swap" rel="stylesheet" /></noscript>
  </head>

    <div id="root"></div>
