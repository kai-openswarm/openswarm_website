<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSwarm | Your AI Desktop</title>
    <meta name="description" content="Everyone gets a Jarvis now. OpenSwarm is your 100% free AI desktop for Mac. Join the free waitlist for early access." />
    <link rel="canonical" href="https://www.openswarm.com/" />
    <!-- Link previews in iMessage, X, Slack, LinkedIn, WhatsApp and Facebook. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenSwarm" />
    <meta property="og:url" content="https://www.openswarm.com/" />
    <meta property="og:title" content="OpenSwarm | Everyone gets a Jarvis now." />
    <meta property="og:description" content="The free AI desktop for Mac, where many agents work at once. Join the waitlist for early access." />
    <meta property="og:image" content="https://www.openswarm.com/media/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenSwarm: Everyone gets a Jarvis now. The free AI desktop for Mac." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenSwarm | Everyone gets a Jarvis now." />
    <meta name="twitter:description" content="The free AI desktop for Mac, where many agents work at once. Join the waitlist for early access." />
    <meta name="twitter:image" content="https://www.openswarm.com/media/og.jpg" />
    <!--meta-domain-verification-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The hero image is the largest paint; start fetching it before the script runs. -->
    <link rel="preload" as="image" href="./media/hero-sky.webp" fetchpriority="high" />
    <!-- Web fonts load without blocking first paint; text shows in the system font until they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Manrope:wght@800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Manrope:wght@800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Manrope:wght@800&display=swap" rel="stylesheet" /></noscript>
